version: '3.8'

services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - smartlogix-net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - smartlogix-net
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-eureka:
    build:
      context: .
      dockerfile: ms-eureka/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - smartlogix-net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-auth:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      ms-eureka:
        condition: service_healthy
    environment:
    - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://ms-eureka:8761/eureka/
    - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require
    - SPRING_DATASOURCE_USERNAME=postgres.gkcyyzzaizzuglmyetpe
    - SPRING_DATASOURCE_PASSWORD=GkCMQaTgcoo4ETva
    - JWT_SECRET=smartlogix-secret-key-2024-super-segura-para-produccion-abc123
    networks:
      - smartlogix-net
    restart: always

  ms-clientes:
    build:
      context: .
      dockerfile: ms-clientes/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      ms-eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://ms-eureka:8761/eureka/
    - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    - SPRING_DATASOURCE_USERNAME=postgres.gkcyyzzaizzuglmyetpe
    - SPRING_DATASOURCE_PASSWORD=GkCMQaTgcoo4ETva
    - JWT_SECRET=smartlogix-secret-key-2024-super-segura-para-produccion-abc123
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    networks:
      - smartlogix-net
    restart: always

  ms-inventario:
    build:
      context: .
      dockerfile: ms-inventario/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      ms-eureka:
        condition: service_healthy
